name: Live End to End Testing

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: e2e-live
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CHECKMARX_BASE_URL: ${{ secrets.CHECKMARX_BASE_URL }}
          CHECKMARX_IAM_URL: ${{ secrets.CHECKMARX_IAM_URL }}
          CHECKMARX_TENANT: ${{ secrets.CHECKMARX_TENANT }}
          CHECKMARX_API_KEY: ${{ secrets.CHECKMARX_API_KEY }}
        run: |
          missing=""
          for name in CHECKMARX_BASE_URL CHECKMARX_IAM_URL CHECKMARX_TENANT CHECKMARX_API_KEY; do
            [ -n "${!name}" ] || missing="${missing} ${name}"
          done
          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: repository secrets not configured:${missing}."
          fi

  e2e:
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      E2E_TARGET: live
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Start harness
        env:
          CHECKMARX_BASE_URL: ${{ secrets.CHECKMARX_BASE_URL }}
          CHECKMARX_IAM_URL: ${{ secrets.CHECKMARX_IAM_URL }}
          CHECKMARX_TENANT: ${{ secrets.CHECKMARX_TENANT }}
          CHECKMARX_API_KEY: ${{ secrets.CHECKMARX_API_KEY }}
        run: test/harness/up.sh
      - name: Run e2e
        run: test/harness/e2e.sh
