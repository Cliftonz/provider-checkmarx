apiVersion: application.checkmarx.m.clifton.quest/v1alpha1
kind: Application
metadata:
  name: example-application
  namespace: default
  annotations:
    meta.upbound.io/example-id: application/v1alpha1/application
    uptest.upbound.io/update-parameter: '{"description":"updated by uptest"}'
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    name: example-application
    description: managed by provider-checkmarx
    criticality: 3
    rules:
      - type: project.name.in
        value: example-project
    tags:
      team: example
